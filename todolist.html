<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To‑Do List — Mini Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header" role="banner">
    <h1 class="app-title">To‑Do List</h1>
    <button id="themeToggle" class="btn" aria-label="Toggle theme" title="Toggle theme">Theme</button>
  </header>

  <main class="main" role="main">
    <section class="compose" aria-label="Add new task">
      <form id="addForm" class="add-form" autocomplete="off">
        <input id="newTitle" class="input" name="title" type="text" placeholder="Add a task…" aria-label="Task title" required />
        <input id="newDue" class="input" name="due" type="date" aria-label="Due date" />
        <select id="newPriority" class="input" name="priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="button" id="newImportant" class="btn" aria-pressed="false" title="Mark as important">★</button>
        <button type="submit" class="btn primary" title="Add task">Add</button>
      </form>
    </section>

    <section class="tools" aria-label="Search and filters">
      <input id="search" class="input search" type="search" placeholder="Search tasks" aria-label="Search tasks" />
      <div class="filters" role="tablist" aria-label="Filters">
        <button class="filter btn" data-filter="all" aria-selected="true">All</button>
        <button class="filter btn" data-filter="active">Active</button>
        <button class="filter btn" data-filter="completed">Completed</button>
        <button class="filter btn" data-filter="important">Important</button>
        <button class="filter btn" data-filter="today">Today</button>
        <button class="filter btn" data-filter="overdue">Overdue</button>
      </div>
    </section>

    <section class="list" aria-label="Task list">
      <ul id="taskList" class="task-list" role="list" aria-live="polite"></ul>
    </section>

    <section class="bulk" aria-label="Bulk actions">
      <div class="bulk-actions">
        <span id="counts" class="counts" aria-live="polite"></span>
        <div class="actions">
          <button id="clearCompleted" class="btn" title="Clear completed">Clear Completed</button>
          <button id="deleteAll" class="btn" title="Delete all tasks">Delete All</button>
          <button id="exportBtn" class="btn" title="Export tasks">Export</button>
          <button id="importBtn" class="btn" title="Import tasks">Import</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
